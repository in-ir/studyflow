# Render Blueprint for the StudyFlow backend.
# Deploy with: Render Dashboard -> New -> Blueprint -> pick this repo.
#
# The frontend is NOT defined here - it deploys to Vercel with root
# directory `frontend`. See the Deployment section of README.md.
services:
  - type: web
    name: studyflow-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ENVIRONMENT
        value: production
      # Generated by Render on first deploy and kept across restarts.
      # Never reuse the development secret here.
      - key: JWT_SECRET_KEY
        generateValue: true
      # Set these in the Render dashboard - they are not stored in the repo.
      #   FRONTEND_ORIGINS -> your Vercel URL, e.g. https://studyflow.vercel.app
      #   ANTHROPIC_API_KEY -> your Claude API key (optional; without it the
      #                        assistant falls back to pattern-based replies)
      - key: FRONTEND_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
